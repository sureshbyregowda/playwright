name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      testFile:
        description: "Playwright test file to execute"
        required: false
        default: ""
        type: string      
      testType:
        description: "Test Type"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression

    
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
          if [ -n "${{ inputs.testFile }}" ]; then
            npx playwright test "${{ inputs.testFile }}"

          if [ "${{ inputs.testType }}" = "smoke" ]; then
            npx playwright test --grep "@smoke"

          elif [ "${{ inputs.testType }}" = "regression" ]; then
            npx playwright test --grep "@regression"

          elif [ "${{ inputs.testType }}" = "all" ]; then
            npx playwright test tests/sample.spec.ts

          else
            npx playwright test
          fi            
 
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30